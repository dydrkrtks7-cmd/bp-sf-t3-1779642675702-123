<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="657" cy="483" r="64" fill="#334155" opacity="0.17"/>
    <circle cx="96" cy="84" r="60" fill="#334155" opacity="0.10"/>
    <circle cx="1047" cy="602" r="25" fill="#334155" opacity="0.05"/>
    <circle cx="1211" cy="581" r="24" fill="#334155" opacity="0.18"/>
    <circle cx="497" cy="348" r="22" fill="#334155" opacity="0.08"/>
    <circle cx="762" cy="58" r="65" fill="#334155" opacity="0.10"/>
    <rect x="885" y="-59" width="28" height="64" rx="8" fill="#0f172a" opacity="0.13" transform="rotate(3, 1137, 478)"/>
    <rect x="19" y="434" width="80" height="79" rx="8" fill="#0f172a" opacity="0.08" transform="rotate(35, 209, 405)"/>
    <rect x="1192" y="722" width="74" height="29" rx="8" fill="#0f172a" opacity="0.11" transform="rotate(44, 909, 726)"/>
    <rect x="1070" y="223" width="57" height="58" rx="8" fill="#0f172a" opacity="0.09" transform="rotate(28, 340, 617)"/>
    <rect x="694" y="122" width="34" height="79" rx="8" fill="#0f172a" opacity="0.03" transform="rotate(40, 591, 723)"/>
    <rect x="332" y="359" width="43" height="39" rx="8" fill="#0f172a" opacity="0.06" transform="rotate(15, 883, 29)"/>
    <rect x="408" y="635" width="72" height="79" rx="8" fill="#0f172a" opacity="0.05" transform="rotate(4, 1217, 352)"/>
    <rect x="1118" y="372" width="38" height="70" rx="8" fill="#0f172a" opacity="0.14" transform="rotate(27, 1046, 35)"/>
    <polygon points="1191,347 1272,509 1110,509" fill="#334155" opacity="0.11"/>
    <polygon points="478,157 500,201 456,201" fill="#334155" opacity="0.07"/>
    <polygon points="1125,-33 1223,163 1027,163" fill="#334155" opacity="0.08"/>
    <polygon points="405,-54 465,66 345,66" fill="#334155" opacity="0.12"/>

  <!-- Wave at bottom -->
  <path d="M0,560 C360,595 840,525 1200,560 L1200,630 L0,630Z" fill="#334155" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    SEO 오토파일럿 가격
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 주식투자
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#6366f1" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 SEO 오토파일럿 가격 — 주식투자
  </text>
</svg>